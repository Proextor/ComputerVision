[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "reactive-vision-m1"
version = "0.5.0"
description = "Webcam pose tracking, room state, and live data service"
requires-python = ">=3.11,<3.12"
dependencies = [
  "opencv-python>=4.10,<6",
  "ultralytics>=8.4,<9",
  "lap>=0.5.12,<1",
  "pydantic>=2.10,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "websockets>=12,<17",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
reactive-vision = "reactive_vision.main:main"
reactive-vision-server = "reactive_vision.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
